<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plac zabaw 3D — Wsparcie na każdym etapie</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:system-ui,sans-serif}
canvas{display:block}
#t{position:fixed;left:0;right:0;bottom:9%;text-align:center;pointer-events:none;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#t span{font-weight:800;font-size:clamp(24px,5.5vw,64px);padding:6px 26px;border-radius:40px;color:#fff;box-shadow:0 8px 24px #0003;animation:f 3s ease-in-out infinite}
#t span:nth-child(1){background:#7b4dd6}#t span:nth-child(2){background:#ffc823;color:#4a3300;animation-delay:.4s}#t span:nth-child(3){background:#ff8a1f;animation-delay:.8s}
@keyframes f{50%{transform:translateY(-8px)}}
#h{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#234;font-size:14px;opacity:.7;pointer-events:none}
#a{position:fixed;bottom:10px;right:10px;background:#fffc;border-radius:14px;padding:14px 20px;font-size:16px;border:0;cursor:pointer}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/jsm/"}}</script></head>
<body><div id="t"><span>Wsparcie</span><span>na każdym</span><span>etapie</span></div>
<div id="h">Przeciągnij = obrót · scroll/pinch = zoom</div><button id="a">⏯ Auto-obrót</button>
<script type="module" src="world.js"></script></body></html>
