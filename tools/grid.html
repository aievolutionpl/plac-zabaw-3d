<body style="margin:0"><div style="position:relative;width:1024px;height:778px"><img src="../models/photo.png" style="width:1024px;height:778px">
<script>const d=document.querySelector('div');for(let x=0;x<=1024;x+=64){d.insertAdjacentHTML('beforeend',`<div style="position:absolute;left:${x}px;top:0;bottom:0;border-left:1px solid #fff9"></div><b style="position:absolute;left:${x+2}px;top:0;font:bold 12px monospace;color:#ff0;background:#000a">${x}</b>`)}
for(let y=0;y<=778;y+=64){d.insertAdjacentHTML('beforeend',`<div style="position:absolute;top:${y}px;left:0;right:0;border-top:1px solid #fff9"></div><b style="position:absolute;top:${y+2}px;left:0;font:bold 12px monospace;color:#0ff;background:#000a">${y}</b>`)}</script></div></body>
